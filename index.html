<style>
/* --- Reset --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* --- Body --- */
body {
  font-family: 'Poppins', sans-serif;
  background: #f9f9f9;
  color: #212529;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* --- Login Card --- */
.login-card {
  background: #ffffff;
  border-radius: 16px;
  padding: 40px 30px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  text-align: center;
}

/* --- Logo --- */
.logo img {
  width: 80px;
  margin-bottom: 16px;
}

.logo span {
  display: block;
  font-size: 24px;
  font-weight: 700;
  color: #00bf63; /* Zong green */
  margin-bottom: 24px;
}

/* --- Header --- */
.login-card p {
  font-size: 14px;
  color: #6c757d;
  margin-bottom: 28px;
}

/* --- Inputs --- */
input {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 16px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 14px;
  transition: all 0.2s ease;
}

input:focus {
  outline: none;
  border-color: #00bf63;
  box-shadow: 0 0 0 3px rgba(0,191,99,0.15);
}

/* --- Button --- */
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  color: white;
  background-color: #00bf63; /* Zong green */
  transition: all 0.3s ease;
}

button:hover {
  background-color: #00a54a;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,191,99,0.3);
}

/* --- Error Message --- */
#errorMsg {
  margin-top: 12px;
  font-size: 13px;
  color: #dc2626;
}
</style>
</head>
